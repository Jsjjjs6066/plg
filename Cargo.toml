[package]
name = "plg"
version = "1.0.0"
edition = "2024"
description = "Tool for syncing playlists with Git."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Jsjjjs6066/plg"
keywords = ["git", "playlist", "playlists", "music", "sync"]
categories = ["command-line-utilities", "multimedia::audio"]
authors = ["Leon Žlender"]
build = "build.rs"
autobins = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] , optional = true}
directories = "6.0.0"
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
chrono = { version = "0.4", features = ["serde"] }
serde_with = { version = "3.23.0", features = ["chrono"] } 
clap_complete = { version = "4.6.11", optional = true }
qtrs = { version = "0.5.9", optional = true }
cxx = { version = "1.0", optional = true }

[features]
cli = ["dep:clap", "dep:clap_complete"]
qt = ["cli", "dep:qtrs", "dep:cxx"]

default = ["cli"]

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = "s"
lto = true  

[[bin]]
name = "plg"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "plg-qt"
path = "src/main.rs"
required-features = ["qt"]

[lib]
crate-type = ["cdylib", "rlib"]
